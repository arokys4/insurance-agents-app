<div class="change-password-page">
  <div class="change-password-card">
    <h1>Zmiana hasła</h1>
    <p>To pierwsze logowanie. Ustaw swoje nowe hasło.</p>

    <form (ngSubmit)="changePassword()">
      <div class="form-field">
        <label for="newPassword">Nowe hasło</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          placeholder="Minimum 6 znaków"
        />
      </div>

      <div class="form-field">
        <label for="repeatPassword">Powtórz hasło</label>
        <input
          id="repeatPassword"
          name="repeatPassword"
          type="password"
          [(ngModel)]="repeatPassword"
          placeholder="Powtórz nowe hasło"
        />
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="submit">Zapisz nowe hasło</button>
    </form>
  </div>
</div>

<div class="page">
  <div class="change-password-card">
    <h1>Zmiana hasła</h1>

    <p class="subtitle">
      To pierwsze logowanie. Ustaw swoje nowe hasło.
    </p>

    <form (ngSubmit)="changePassword()">
      <div class="form-field">
        <label for="newPassword">Nowe hasło</label>

        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          placeholder="np. Agent@123"
        />
      </div>

      <div class="form-field">
        <label for="confirmPassword">Powtórz hasło</label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Powtórz nowe hasło"
        />
      </div>

      <p class="password-hint">
        Hasło musi mieć minimum 8 znaków, małą literę, wielką literę, cyfrę i znak specjalny.
      </p>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button type="submit">
        Zapisz nowe hasło
      </button>
    </form>
  </div>
</div>

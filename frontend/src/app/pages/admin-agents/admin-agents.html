<div class="page">
  <header class="header">
    <div>
      <h1>Agenci</h1>
      <p>Lista agentów ubezpieczeniowych przypisanych do zespołu.</p>
    </div>

    <button type="button" (click)="goBack()">Powrót</button>
  </header>

  <section class="toolbar">
    <button type="button" (click)="showAddAgentForm()">Dodaj agenta</button>
  </section>

  <section class="form-card" *ngIf="showForm">
    <h2>{{ editMode ? 'Edycja agenta' : 'Dodawanie nowego agenta' }}</h2>

    <form (ngSubmit)="saveAgent()">
      <div class="form-grid">
        <div class="form-field">
          <label for="firstName">Imię</label>
          <input
            id="firstName"
            name="firstName"
            type="text"
            [(ngModel)]="agentForm.firstName"
            placeholder="np. Adam"
          />
        </div>

        <div class="form-field">
          <label for="lastName">Nazwisko</label>
          <input
            id="lastName"
            name="lastName"
            type="text"
            [(ngModel)]="agentForm.lastName"
            placeholder="np. Zieliński"
          />
        </div>

        <div class="form-field">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="agentForm.email"
            placeholder="np. adam.zielinski@firma.pl"
          />
        </div>

        <div class="form-field">
          <label for="phone">Telefon</label>
          <input
            id="phone"
            name="phone"
            type="text"
            [(ngModel)]="agentForm.phone"
            placeholder="np. 500 700 800"
          />
        </div>

        <div class="form-field">
          <label for="status">Status</label>
          <select
            id="status"
            name="status"
            [(ngModel)]="agentForm.status"
          >
            <option value="Aktywny">Aktywny</option>
            <option value="Nieaktywny">Nieaktywny</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit">
          {{ editMode ? 'Zapisz zmiany' : 'Zapisz' }}
        </button>

        <button type="button" class="secondary-button" (click)="cancel()">
          Anuluj
        </button>
      </div>
    </form>
  </section>

  <section class="agents-table">
    <table>
      <thead>
        <tr>
          <th>Imię i nazwisko</th>
          <th>E-mail</th>
          <th>Telefon</th>
          <th>Status</th>
          <th>Akcje</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let agent of agents">
          <td>{{ agent.firstName }} {{ agent.lastName }}</td>
          <td>{{ agent.email }}</td>
          <td>{{ agent.phone }}</td>
          <td>{{ agent.status }}</td>
          <td>
            <button type="button" (click)="editAgent(agent)">Edytuj</button>

            <button type="button">Szczegóły</button>

            <button
              type="button"
              class="danger-button"
              *ngIf="agent.status === 'Aktywny' || agent.status === 'Aktywna'"
              (click)="deactivateAgent(agent)"
            >
              Dezaktywuj
            </button>

            <button
              type="button"
              class="success-button"
              *ngIf="agent.status === 'Nieaktywny'"
              (click)="activateAgent(agent)"
            >
              Aktywuj
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</div>

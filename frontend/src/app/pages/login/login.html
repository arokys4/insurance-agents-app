<div class="login-page">
  <div class="login-card">
    <h1>System nadzoru agentów</h1>
    <p>Zaloguj się do aplikacji.</p>

    <form (ngSubmit)="login()">
      <div class="form-field">
        <label for="email">Adres e-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="np. admin@firma.pl"
        />
      </div>

      <div class="form-field">
        <label for="password">Hasło</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Wpisz hasło"
        />
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="submit">Zaloguj</button>
    </form>

    <div class="login-info">
      <p><strong>Konto administratora:</strong></p>
      <p>admin@firma.pl / admin123</p>
    </div>
  </div>
</div>
